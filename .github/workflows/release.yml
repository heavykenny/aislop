name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to recover
        required: true
        type: string
      publish:
        description: Publish after the trusted publishing preflight passes
        required: true
        default: false
        type: boolean
      move-major-tag:
        description: Move v1 after publishing a stable release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install npm 12
        run: npm install --global npm@12.0.1

      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          expected_tag="v$(node -p 'require("./package.json").version')"
          if [ "$RELEASE_TAG" != "$expected_tag" ]; then
            echo "Release tag $RELEASE_TAG does not match package version $expected_tag" >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm vitest run

      - name: Self-scan
        run: node dist/cli.js scan . --json
        env:
          AISLOP_NO_HISTORY: "1"
          AISLOP_NO_TELEMETRY: "1"
          AISLOP_NO_UPDATE_NOTIFIER: "1"
          DO_NOT_TRACK: "1"

      - name: Verify npm trusted publishing
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          trap 'rm -f "$log_file"' EXIT
          npm publish --access public --dry-run --loglevel verbose 2>&1 | tee "$log_file"
          if ! grep -Fq "Successfully retrieved and set token" "$log_file"; then
            echo "npm trusted publishing token exchange failed" >&2
            exit 1
          fi

      - name: Publish to npm
        if: ${{ github.event_name == 'release' || inputs.publish }}
        run: npm publish --access public

  publish-gpr:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    needs: publish-npm
    if: ${{ github.event_name == 'release' || inputs.publish }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://npm.pkg.github.com
          scope: '@scanaislop'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Set scoped package name
        run: npm pkg set name="@scanaislop/aislop"

      - name: Publish to GitHub Packages
        run: npm publish --access public --registry=https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  move-major-tag:
    name: Move v1 Action tag to this release
    runs-on: ubuntu-latest
    needs: publish-npm
    if: >-
      ${{
        (github.event_name == 'release' && !github.event.release.prerelease) ||
        (github.event_name == 'workflow_dispatch' && inputs.publish && inputs.move-major-tag)
      }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Re-point v1 to ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          git tag -f v1
          git push origin v1 --force
